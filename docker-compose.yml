version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytestorm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models_weights:/app/models_weights
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: bytestorm-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
